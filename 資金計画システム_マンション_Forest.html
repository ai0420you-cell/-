<!-- vre.03: デザイン・文言修正（タイトル非表示、TEL追加、日付形式、固定費合計、注意書き改訂、諸費用明細書） -->
<!-- vre.04: 諸費用0円バグ修正（misc_overrides自動クリア）、コードレビュー対応 -->

             参考価格ラベル対応、JSON設定配布機能、レイアウト改善、固定資産税表示、

<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>資金計画システム（マンション）Ver.2</title>
<style>
/* ---------- Base ---------- */
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  color: #1c2733;
  background: #f4f6fa;
  font-size: 14px;
  min-height: 100vh;
}

/* ---------- Header ---------- */
.app-header {
  position: sticky; top: 0; z-index: 20;
  background: linear-gradient(180deg, #1f3a5f 0%, #24476f 100%);
  color: #fff;
  padding: 12px 20px 0;
  box-shadow: 0 2px 6px rgba(0,0,0,.15);
}
.brand { display: flex; align-items: baseline; gap: 14px; margin-bottom: 10px; }
.brand h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: .04em; }
.brand-sub { color: #cfe1f5; font-size: 12px; }

.tabs { display: flex; flex-wrap: wrap; gap: 2px; }
.tabs button {
  border: 0; background: rgba(255,255,255,.06); color: #cfe1f5;
  padding: 8px 14px; cursor: pointer; font-size: 13px;
  border-radius: 6px 6px 0 0;
  transition: background .15s ease;
}
.tabs button:hover { background: rgba(255,255,255,.15); color: #fff; }
.tabs button.active { background: #f4f6fa; color: #1c2733; font-weight: 600; }

/* ---------- Main ---------- */
main {
  padding: 20px;
  max-width: 1400px;
  margin: 0 auto;
}
h2.section-title {
  font-size: 16px; font-weight: 600;
  margin: 0 0 12px 0;
  padding: 8px 12px;
  border-left: 4px solid #24476f;
  background: #eaf0f9;
}
.card {
  background: #fff;
  border-radius: 8px;
  border: 1px solid #dde3ee;
  padding: 16px 18px;
  margin-bottom: 16px;
  box-shadow: 0 1px 2px rgba(0,0,0,.03);
}
.card h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; color: #24476f; }

.grid { display: grid; gap: 8px 12px; }
.grid.cols-2 { grid-template-columns: 1fr 1fr; }
.grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
.field { display: flex; flex-direction: column; gap: 3px; }
.field label {
  font-size: 12px; color: #556274;
}
.field input, .field select, .field textarea {
  padding: 6px 8px; font-size: 13px;
  border: 1px solid #cfd6e2; border-radius: 4px;
  background: #fff;
  font-family: inherit;
}
.field input[readonly], .field input:disabled {
  background: #f0f2f6; color: #556274;
}
.field.inline { flex-direction: row; align-items: center; gap: 8px; }
.field.inline label { width: 130px; font-size: 13px; color: #1c2733; }

/* Loan block */
.loan-block { border: 1px solid #dde3ee; border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; background: #fbfcfd; }
.loan-block h4 { margin: 0 0 8px; color: #24476f; font-size: 13px; }

/* Tables */
table.data-table {
  border-collapse: collapse;
  width: 100%;
  font-size: 12px;
  background: #fff;
}
table.data-table th, table.data-table td {
  border: 1px solid #dde3ee;
  padding: 4px 6px;
  text-align: right;
  white-space: nowrap;
}
table.data-table th {
  background: #eaf0f9;
  font-weight: 600;
  text-align: center;
  color: #24476f;
}
table.data-table td.left, table.data-table th.left { text-align: left; }
table.data-table td.center, table.data-table th.center { text-align: center; }
table.data-table tr.total td { background: #fff8e1; font-weight: 600; }
table.data-table tr.sub-total td { background: #eef4ff; font-weight: 600; border-top: 1px solid #dde3ee !important; }
table.data-table input, table.data-table select {
  width: 100%; padding: 3px 5px; font-size: 12px;
  border: 1px solid #cfd6e2; border-radius: 3px;
  font-family: inherit; background: #fff;
}
table.data-table input.right { text-align: right; }

/* Fund plan output card */
.fund-plan {
  background: #fff;
  padding: 20px;
  border: 1px solid #dde3ee;
  border-radius: 6px;
  font-size: 12px;
}
.fund-plan h1 {
  font-size: 18px; margin: 0 0 10px; color: #24476f;
  border-bottom: 2px solid #24476f; padding-bottom: 6px;
}
.fund-plan h2 { font-size: 14px; margin: 12px 0 6px; color: #24476f; }
.fund-plan .row { display: flex; gap: 20px; margin: 4px 0; }
.fund-plan .row .lbl { font-weight: 600; color: #556274; min-width: 120px; }

/* Buttons */
button.btn {
  border: 1px solid #24476f; color: #fff; background: #24476f;
  padding: 6px 12px; border-radius: 4px; cursor: pointer;
  font-size: 13px;
}
button.btn:hover { background: #1c3757; }
button.btn.ghost {
  background: #fff; color: #24476f;
}
button.btn.ghost:hover { background: #eaf0f9; }
button.btn.danger { background: #b93131; border-color: #b93131; }
button.btn.small { padding: 3px 8px; font-size: 12px; }

.actions { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }

/* Footer */
.app-footer {
  padding: 10px 20px;
  border-top: 1px solid #dde3ee;
  background: #eaf0f9;
  color: #556274;
  font-size: 12px;
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 10px;
}
.footer-left { display: flex; gap: 20px; }
.footer-right { display: flex; gap: 6px; }
.footer-right button {
  border: 1px solid #cfd6e2; background: #fff; color: #1c2733;
  padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px;
}
.footer-right button:hover { background: #f4f6fa; }

/* Notes */
.note {
  font-size: 11px; color: #556274; line-height: 1.6;
  padding: 8px 10px; background: #f7f9fc; border-left: 3px solid #cfd6e2;
  border-radius: 3px; margin-top: 8px;
}

/* Loan table scroll */
.scroll-x { overflow-x: auto; }

/* Money highlight */
.money-strong { font-weight: 700; color: #24476f; font-size: 16px; }
.money-monthly { font-weight: 800; color: #b93131; font-size: 20px; letter-spacing: 0.02em; }

/* Section headers in output */
.output-header {
  background: #24476f; color: #fff;
  padding: 6px 10px; font-size: 13px; font-weight: 600;
  margin-bottom: 8px; border-radius: 4px; text-align: left;
}

/* Fixed-cost subtotal row (light blue) */
tr.plan-section-spacer > td { height:10px; padding:0; background:transparent; border-color:transparent !important; }
tr.plan-section-hdr > td { padding: 8px 0 4px 0; background: transparent; border-color: transparent !important; border-bottom: 1px solid #c5d9ea !important; text-align: left; }
tr.plan-col-hdr > td { background:#dce8f3; color:#1a365d; font-weight:600; font-size:12px; padding:4px 8px; text-align:right; border-color:#c5d9ea; }
tr.plan-col-hdr > td.left { text-align:left; }
tr.plan-col-hdr > td.center { text-align:center; }
table.data-table tr.fixed-total-row td { background: #dbeafe; font-weight: 600; }
/* Spacer row between fixed costs and loan */
table.data-table tr.spacer-row td { height: 6px; padding: 0 !important; background: transparent; border-color: transparent !important; border-bottom: 1px solid #dde3ee !important; }
/* Optional items rows (no input elements) - match height of input rows */
tr.fc-plain-row > td { padding: 7px 6px; }
/* Print logo (hidden on screen, visible on print) */
.print-logo { display: none; }
@media print { .print-logo { display: flex; justify-content: flex-end; align-items: center; margin-top: 4px; padding-top: 4px; break-before: avoid; } }

/* Muted */
.muted { color: #8894a7; }

/* Print */
@media print {
  /* ブラウザの背景色省略を無効化してカラー印刷を強制 */
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  /* 非表示にする要素 */
  .app-header, .app-footer, .actions, .tabs,
  .input-screen, #tab-misc, #tab-loans, #tab-settings,
  #tab-property, #tab-types, #tab-staff, #tab-loanlist, #tab-guarantee,
  .no-print { display: none !important; }
  tr.plan-section-hdr > td { background: transparent !important; border-color: transparent !important; border-bottom: 1px solid #c5d9ea !important; }

  /* ページ設定 */
  @page { size: A4; margin: 8mm 10mm; }
  html, body { margin: 0; padding: 0; background: #fff; font-size: 9pt; }
  main { padding: 0; max-width: none; }

  /* アクティブなタブコンテンツのみ表示 */
  .tab-content { display: none !important; }
  .tab-content.active { display: block !important; }

  /* カード・レイアウト */
  .card { box-shadow: none !important; border: 1px solid #ccc !important; margin: 3px 0 !important; padding: 5px !important; break-inside: avoid; }

  /* テーブルをコンパクトに */
  .data-table th, .data-table td { padding: 2px 3px !important; font-size: 8pt !important; }
  .output-header { padding: 2px 5px !important; font-size: 8.5pt !important; margin-bottom: 2px !important; margin-top: 6px !important; }

  /* 資金計画出力の各セクション */
  .fund-summary { gap: 6px !important; }
  .fund-panel { padding: 5px !important; }
  .scroll-x { overflow: visible !important; }

  /* 出力ヘッダー部分 */
  .output-title-bar { padding: 4px 8px !important; }
  .output-title-bar h2 { font-size: 12pt !important; }

  /* 物件・資金サマリー */
  .property-summary { gap: 5px !important; }
  .prop-col { font-size: 8pt !important; }
  .prop-col .row { padding: 1px 0 !important; }

  /* 改ページ制御（注記は break-inside:avoid を外してページまたぎを許可） */
  .output-header { break-before: avoid; }
  .note { font-size: 6.5pt !important; margin-top: 3px !important; line-height: 1.35 !important; }

  /* 住宅ローン減税テーブルを小さく */
  .deduction-table { width: 100% !important; table-layout: fixed !important; }
  .deduction-table th, .deduction-table td { font-size: 6.5pt !important; padding: 1px 2px !important; text-align: center !important; }

  /* お支払例テーブル共通: table-layout:fixed + 幅100% */
  .stage-rate { width: 100% !important; table-layout: fixed !important; }

  /* 段階金利テーブル: 10列 */
  .plan-staged-mode .stage-rate th,
  .plan-staged-mode .stage-rate td {
    font-size: 6.5pt !important;
    padding: 1px 2px !important;
    white-space: normal !important;
    word-break: break-all !important;
    overflow-wrap: anywhere !important;
    line-height: 1.2 !important;
    text-align: center !important;
  }
  .plan-staged-mode .stage-rate td { text-align: right !important; }
  .plan-staged-mode .stage-rate td.left,
  .plan-staged-mode .stage-rate td.stage-label { text-align: left !important; }
  /* 融資分類列：幅を広げてテキスト折り返しを抑制 */
  .plan-staged-mode .stage-rate th:first-child { width: 22% !important; }
  /* 当初支払テーブル: 6列（段階金利と同じ設定を適用してバランス統一） */
  .plan-initial-mode .stage-rate th,
  .plan-initial-mode .stage-rate td {
    font-size: 7pt !important;
    padding: 1px 2px !important;
    white-space: normal !important;
    word-break: break-all !important;
    overflow-wrap: anywhere !important;
    line-height: 1.2 !important;
    text-align: center !important;
  }
  .plan-initial-mode .stage-rate td { text-align: right !important; }
  .plan-initial-mode .stage-rate td.left { text-align: left !important; }
  .plan-initial-mode .stage-rate th:first-child { width: 30% !important; }

  /* 段階金利: A4 1枚に収める */
  .plan-staged-mode .card { padding: 3px 5px !important; }
  .plan-staged-mode .output-title-bar { padding: 3px 8px !important; }
  .plan-staged-mode .output-title-bar h2 { font-size: 11pt !important; }
  .plan-staged-mode .property-summary { margin-bottom: 3px !important; gap: 5px !important; }
  .plan-staged-mode .prop-col .row { padding: 1px 0 !important; }
  .plan-staged-mode .prop-col { font-size: 7.5pt !important; }
  .plan-staged-mode .output-header { margin-top: 5px !important; margin-bottom: 1px !important; padding: 2px 4px !important; font-size: 8pt !important; }
  .plan-staged-mode .data-table th, .plan-staged-mode .data-table td { padding: 1px 2px !important; font-size: 7.5pt !important; }
  .plan-staged-mode .fund-summary { margin-bottom: 3px !important; gap: 5px !important; }
  .plan-staged-mode .fund-panel { padding: 2px 5px !important; }
  .plan-staged-mode .fund-panel .row { padding: 1px 0 !important; font-size: 7.5pt !important; }
  .plan-staged-mode .note { font-size: 5.5pt !important; margin-top: 1px !important; line-height: 1.15 !important; column-count: 2; column-gap: 8px; }
  .plan-staged-mode .print-logo { margin-top: 2px !important; padding-top: 2px !important; }
  .plan-staged-mode .print-logo img { height: 22px !important; }

  /* 当初支払のみ: A4 1枚に収める */
  .plan-initial-mode .card { padding: 3px 5px !important; }
  .plan-initial-mode .output-title-bar { padding: 3px 8px !important; }
  .plan-initial-mode .output-title-bar h2 { font-size: 11pt !important; }
  .plan-initial-mode .property-summary { margin-bottom: 3px !important; gap: 5px !important; }
  .plan-initial-mode .prop-col .row { padding: 1px 0 !important; }
  .plan-initial-mode .prop-col { font-size: 7.5pt !important; }
  .plan-initial-mode .output-header { margin-top: 5px !important; margin-bottom: 1px !important; padding: 2px 4px !important; font-size: 8pt !important; }
  .plan-initial-mode .data-table th, .plan-initial-mode .data-table td { padding: 1px 2px !important; font-size: 7.5pt !important; }
  .plan-initial-mode .fund-summary { margin-bottom: 3px !important; gap: 5px !important; }
  .plan-initial-mode .fund-panel { padding: 2px 5px !important; }
  .plan-initial-mode .fund-panel .row { padding: 1px 0 !important; font-size: 7.5pt !important; }
  .plan-initial-mode .note { font-size: 5.5pt !important; margin-top: 1px !important; line-height: 1.15 !important; column-count: 2; column-gap: 8px; }
  .plan-initial-mode .print-logo { margin-top: 2px !important; padding-top: 2px !important; }
  .plan-initial-mode .print-logo img { height: 22px !important; }
  .plan-initial-mode tr.plan-section-spacer > td { height: 3px !important; }
  .plan-initial-mode tr.spacer-row td { height: 2px !important; }

  /* 住宅ローン計算テーブル: 印刷時は全行表示 */
  .loan-table-scroll { max-height: none !important; overflow: visible !important; }

  /* 余白ページ防止 */
  body, html { min-height: 0 !important; height: auto !important; }
  main { min-height: 0 !important; height: auto !important; }
  .tab-content.active { height: auto !important; min-height: 0 !important; }
  /* 駐車場パネル：印刷時も3列維持 */
  .fund-summary.has-parking { grid-template-columns: 1.2fr 1fr 1fr !important; }
  /* 印刷時：数値（円）セルを右寄り */
  .fund-plan table td:not(.left):not(.center):not(.stage-label) { text-align: right !important; }
  .fund-plan .fund-panel-data .row { justify-content: space-between !important; }
  /* 購入者情報+物件価格パネル：印刷時は2列に戻す */
  .fund-summary-top { grid-template-columns: 1.4fr 1fr !important; }
  /* 駐車場パネル：印刷時はフォント・余白を極小化 */
  .plan-staged-mode .parking-panel,
  .plan-initial-mode .parking-panel { font-size: 6pt !important; padding: 2px 4px !important; }
  .plan-staged-mode .parking-panel div,
  .plan-initial-mode .parking-panel div { margin: 0 !important; line-height: 1.25 !important; }
  /* ペアローン個別控除・固定資産税：印刷時コンパクト化 */
  .pair-loan-section { font-size: 8pt !important; padding: 2px 5px !important; margin: 1px 0 3px !important; line-height: 1.3 !important; }
  .pair-loan-section span { font-size: 7.5pt !important; }
  .property-tax-section { font-size: 8pt !important; padding: 2px 5px !important; margin-top: 3px !important; margin-bottom: 3px !important; line-height: 1.3 !important; }
  .property-tax-section span { font-size: 8pt !important; }
}

/* Utility */
.hr { height: 1px; background: #dde3ee; margin: 12px 0; }
.pill {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  background: #eaf0f9; color: #24476f; font-size: 11px; margin-right: 4px;
}

/* Master list table */
.master-table { max-height: 600px; overflow-y: auto; border: 1px solid #dde3ee; border-radius: 4px; }
.master-table table { border-collapse: collapse; width: 100%; font-size: 12px; }
.master-table th {
  position: sticky; top: 0;
  background: #eaf0f9; padding: 5px 6px; border: 1px solid #dde3ee;
  color: #24476f; font-weight: 600; z-index: 1;
}
.master-table td { border: 1px solid #dde3ee; padding: 3px 5px; }
.master-table td input, .master-table td select {
  width: 100%; padding: 3px 5px; border: 1px solid transparent;
  background: transparent; font-size: 12px; font-family: inherit;
}
.master-table td input:focus, .master-table td select:focus {
  background: #fff; border-color: #24476f;
}
.master-table td.right, .master-table td input.right { text-align: right; }

/* Fund plan output layout */
.fund-summary { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-bottom: 12px; }
.fund-summary.has-parking { grid-template-columns: 1.2fr 1fr 1fr; }
.fund-summary-top { grid-template-columns: 1fr !important; }
.fund-panel { padding: 10px 12px; border: 1px solid #dde3ee; border-radius: 4px; background: #fbfcfd; }
.fund-panel h3 { margin: 0 0 6px; font-size: 13px; color: #24476f; }
.fund-panel-data .row { border-bottom: 1px solid #dde3ee; padding: 5px 0; }
.fund-panel-data .row:last-child { border-bottom: none; }

/* Stage rate table */
table.stage-rate td.stage-label { background: #eaf0f9; font-weight: 600; text-align: left; }

/* Highlights */
.hl-total { background: #fff8e1; font-weight: 600; }
.hl-sub { background: #eef4ff; }

/* Inline editable inputs in output tables */
input.ce-lbl, input.ce-amt {
  border: 1px solid transparent; background: transparent;
  padding: 1px 3px; width: 100%; font-size: inherit;
  color: inherit; font-family: inherit; box-sizing: border-box;
}
input.ce-lbl:hover, input.ce-amt:hover,
input.ce-lbl:focus, input.ce-amt:focus {
  border-color: #90aee0; background: #f0f6ff; outline: none;
}
input.ce-amt { text-align: right; }
input.ce-amt.ov-active { border-color: #f59e0b !important; background: #fffbeb !important; }
@media print {
  input.ce-lbl, input.ce-amt { border-color: transparent !important; background: transparent !important; }
}

/* Search input */
input.search {
  width: 240px; padding: 5px 8px; font-size: 13px;
  border: 1px solid #cfd6e2; border-radius: 4px;
}

/* Toast */
#toast {
  position: fixed; right: 20px; bottom: 60px;
  background: #24476f; color: #fff; padding: 10px 16px;
  border-radius: 4px; box-shadow: 0 4px 12px rgba(0,0,0,.2);
  opacity: 0; transform: translateY(20px); transition: all .3s ease;
  z-index: 100;
}
#toast.show { opacity: 1; transform: translateY(0); }

/* ---------- Excel-style Input Screen ---------- */
.input-screen-header {
  display: flex; justify-content: space-between; align-items: flex-end;
  gap: 20px; margin-bottom: 8px;
  padding: 10px 14px; background: #fff; border-bottom: 2px solid #24476f;
}
.input-screen-title { font-size: 22px; font-weight: 600; color: #1c2733; margin: 0; letter-spacing: .02em; }
.hdr-fields { display: flex; gap: 18px; align-items: flex-end; }
.hdr-fields .field { display: flex; flex-direction: column; gap: 2px; }
.hdr-fields .field label { font-size: 11px; color: #1c2733; font-weight: 600; }
.hdr-fields .field .row { display: flex; align-items: center; gap: 4px; }
.hdr-fields select, .hdr-fields input {
  padding: 3px 6px; font-size: 12px; border: 1px solid #808080;
  background: #fff; font-family: inherit;
}
.hdr-fields input.txt-right { text-align: right; width: 90px; }
.hdr-fields .suffix { font-size: 11px; color: #1c2733; }

.req-red { background: #ff2c2c !important; color: #fff !important; }
.req-red option { color: #1c2733; background: #fff; }

.sub-tabs { display: flex; gap: 0; margin: 4px 0 0 0; }
.sub-tabs button {
  padding: 5px 18px; border: 1px solid #808080; border-bottom: none;
  background: #d0d5df; color: #1c2733; cursor: pointer;
  font-size: 12px; font-family: inherit;
}
.sub-tabs button.active { background: #fff; font-weight: 600; }

.panel-white { background: #fff; border: 1px solid #808080; padding: 12px 14px; margin-bottom: 0; }

.row-line { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 4px 0; font-size: 12px; }
.row-line .lbl { color: #1c2733; }
.row-line input[type="text"], .row-line input[type="number"] {

.row-line input.editable { background: #fff; }
.row-line input.txt-right { text-align: right; }
.row-line select { padding: 3px 5px; border: 1px solid #808080; font-size: 12px; font-family: inherit; }

.cust-line {

}
.cust-line .cust-label { font-size: 12px; font-weight: 600; color: #1c2733; }
.cust-line .cust-label small { display: block; font-size: 10px; font-weight: normal; color: #556274; }

  padding: 3px 5px; border: 1px solid #808080; font-size: 12px; font-family: inherit;

}
.cust-line input.editable { background: #fff; }
.cust-line input.txt-right { text-align: right; }
.cust-line .with-suffix { display: flex; align-items: center; gap: 4px; }

.right-toggles { display: flex; flex-direction: column; gap: 6px; margin-left: auto; font-size: 11px; }
.right-toggles .toggle-line { display: flex; gap: 8px; align-items: center; }
.right-toggles .tl-label { min-width: 130px; font-weight: 600; color: #1c2733; }
.right-toggles label.radio { display: flex; gap: 3px; align-items: center; font-size: 11px; }

.price-override-box {

  border: 1px solid #808080; background: #f0f2f6; font-size: 12px;
}
.price-override-box input[type="number"] { width: 80px; text-align: right; padding: 3px 5px; border: 1px solid #808080; background: #d9d9d9; }
.price-override-box input.editable { background: #fff; }

/* Loan input table (Excel-blue theme) */
.loan-tabs-wrapper { margin-top: 8px; }
table.loan-input { border-collapse: collapse; width: 100%; font-size: 11px; }
table.loan-input th {
  background: #1e4a8f; color: #fff; padding: 4px 4px;
  text-align: center; border: 1px solid #0b2c5c;
  font-weight: 600; font-size: 11px; vertical-align: middle;
}
table.loan-input td {
  border: 1px solid #808080; padding: 2px 3px; background: #fff;
}
table.loan-input td input, table.loan-input td select {
  width: 100%; padding: 3px 4px; border: 1px solid #808080;
  font-size: 11px; font-family: inherit; background: #d9d9d9; box-sizing: border-box;
}
table.loan-input td select.req-red, table.loan-input td input.req-red { background: #ff2c2c; color: #fff; }

.warn-note { color: #b93131; font-size: 11px; text-align: center; margin: 4px 0; font-weight: 600; }

.summary-wrap { display: grid; grid-template-columns: 1.1fr 1.2fr 170px; gap: 12px; margin-top: 10px; }
.summary-col { background: #fff; padding: 10px; border: 1px solid #808080; }
.sum-line { display: grid; grid-template-columns: 88px 1fr 34px; gap: 6px; align-items: center; margin: 3px 0; font-size: 11px; }
.sum-line label { color: #1c2733; }
.sum-line input {
  padding: 3px 5px; text-align: right; border: 1px solid #808080;
  font-size: 11px; background: #d9d9d9; font-family: inherit;
}
.sum-line input.editable { background: #fff; }
.sum-line input.req-red { background: #ff2c2c; color: #fff; }

.info-table { border-collapse: collapse; width: 100%; font-size: 11px; }
.info-table td { border: 1px solid #808080; padding: 4px 6px; background: #fff; }
.info-table td.lbl { background: #d9d9d9; font-weight: 600; text-align: center; }

.btn-column { display: flex; flex-direction: column; gap: 4px; }

/* ===================================================================
   Theme: Forest（画面表示のみ。印刷・機能には影響しません）
   =================================================================== */
@media screen {
  :root {
    --ink: #1f2a26; --muted: #62706a; --line: #e2e7e1;
    --brand: #1f5a49; --brand-dark: #154236; --brand-soft: #e6f0eb;
    --accent: #c8923a; --paper: #f6f4ee;
  }
  html, body { background: var(--paper); color: var(--ink); font-size: 14px; }

  .app-header {
    background: #fff; color: var(--ink);
    padding: 14px 24px 0; box-shadow: 0 1px 0 var(--line), 0 6px 18px rgba(31,90,73,.06);
  }
  .brand h1 { color: var(--brand); font-size: 19px; letter-spacing: .06em; padding-left: 12px; border-left: 4px solid var(--accent); }
  .brand-sub { color: var(--muted); }
  .tabs { gap: 4px; padding-bottom: 10px; }
  .tabs button {
    background: transparent; color: var(--muted); border-radius: 999px;
    padding: 7px 16px; font-weight: 500;
  }
  .tabs button:hover { background: var(--brand-soft); color: var(--brand); }
  .tabs button.active { background: var(--brand); color: #fff; font-weight: 600; box-shadow: 0 2px 8px rgba(31,90,73,.3); }

  h2.section-title { background: var(--brand-soft); border-left: 0; border-radius: 10px; color: var(--brand-dark); padding: 10px 16px; }
  .card { border-radius: 14px; border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(31,42,38,.05); padding: 18px 20px; }
  .card h3, .loan-block h4 { color: var(--brand); }
  .loan-block { border-radius: 10px; border-color: var(--line); background: #fbfaf6; }

  .field label { color: var(--muted); }
  .field input, .field select, .field textarea,
  table.data-table input, table.data-table select {
    border-color: #d3dad3; border-radius: 8px; background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus,
  table.data-table input:focus, table.data-table select:focus {
    outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(31,90,73,.15);
  }
  .field input[readonly], .field input:disabled { background: #f1f3ee; color: var(--muted); }

  table.data-table { border-collapse: separate; border-spacing: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  table.data-table th, table.data-table td { border-color: var(--line); border-width: 0 0 1px 0; padding: 6px 8px; }
  table.data-table th { background: var(--brand-soft); color: var(--brand-dark); }
  table.data-table tr:hover > td { background-color: #fafbf8; }
  table.data-table tr.total td { background: #fbf1da; }
  table.data-table tr.sub-total td { background: #eef5f1; border-top-color: var(--line) !important; }
  table.data-table tr.fixed-total-row td { background: #dcebe4; }
  tr.plan-col-hdr > td { background: #dcebe4; color: var(--brand-dark); border-color: var(--line); }
  tr.plan-section-hdr > td { border-bottom-color: #b9d3c7 !important; }

  .fund-plan { border-radius: 12px; border-color: var(--line); }
  .fund-plan h1 { color: var(--brand); border-bottom-color: var(--accent); }
  .fund-plan h2 { color: var(--brand); }
  .output-header { background: linear-gradient(90deg, var(--brand), #2f7a63); border-radius: 8px; }

  button.btn { background: var(--brand); border-color: var(--brand); border-radius: 8px; padding: 7px 14px; font-weight: 500; }
  button.btn:hover { background: var(--brand-dark); }
  button.btn.ghost { background: #fff; color: var(--brand); }
  button.btn.ghost:hover { background: var(--brand-soft); }
  button.btn.danger { background: #b93131; border-color: #b93131; }
  .btn-column button:hover { background: var(--brand-soft); }

  .money-strong { color: var(--brand); }
  .money-monthly { color: #b4432f; }
  .note { background: #f8f6ef; border-left-color: var(--accent); color: var(--muted); border-radius: 6px; }
  .note-right, .other-loan-note { color: var(--muted); }

  .memo-area, .other-loan-note { border-color: #cfd6cd; border-radius: 10px; }
  .memo-area textarea, #in_memo_body, .memo-cond input[type="number"] { border-color: #cfd6cd; border-radius: 6px; }

  .app-footer { background: #fff; border-top: 1px solid var(--line); color: var(--muted); }
  .footer-right button { border-radius: 999px; border-color: #d3dad3; padding: 5px 14px; }
  .footer-right button:hover { background: var(--brand-soft); color: var(--brand); }

  /* ---- 入力画面（Excel風レイアウト）---- */
  .input-screen-header { border: 1px solid var(--line); border-bottom: 3px solid var(--accent); border-radius: 14px 14px 0 0; background: #fff; }
  .input-screen-title { color: var(--brand-dark); }
  .hdr-fields select, .hdr-fields input, .row-line input[type="text"], .row-line input[type="number"],
  .row-line select, .cust-line input, .sum-line input, .price-override-box input[type="number"],

  .sum-line input.editable, .price-override-box input.editable,
  table.loan-input td input.editable, table.loan-input td select.editable { background-color: #fff; }
  .hdr-fields input:focus, .row-line input:focus, .cust-line input:focus, .sum-line input:focus,
  table.loan-input td input:focus, table.loan-input td select:focus {

  }
  .req-red, table.loan-input td select.req-red, table.loan-input td input.req-red, .sum-line input.req-red {
    background: #e5604d !important; color: #fff !important; border-color: #cf4a37 !important;
  }
  .sub-tabs { gap: 4px; }
  .sub-tabs button { border: 0; border-radius: 10px 10px 0 0; background: #e4e8e1; color: var(--muted); padding: 7px 20px; }
  .sub-tabs button.active { background: #fff; color: var(--brand); box-shadow: 0 -2px 0 var(--accent) inset; }
  .panel-white, .summary-col, .price-override-box { border: 1px solid var(--line); border-radius: 0 12px 12px 12px; }
  .summary-col, .price-override-box { border-radius: 12px; }
  .price-override-box { background: #f5f3ec; }
  .cust-line .cust-label small { color: var(--muted); }

  table.loan-input { border-collapse: separate; border-spacing: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  table.loan-input th { background: var(--brand); border: 0; border-right: 1px solid rgba(255,255,255,.18); border-bottom: 1px solid rgba(255,255,255,.18); padding: 6px 4px; }
  table.loan-input td { border: 0; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
  table.loan-input td.readonly { background: #f3f4ef; }

  .info-table { border-collapse: separate; border-spacing: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .info-table td { border: 0; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
  .info-table td.lbl { background: var(--brand-soft); color: var(--brand-dark); }

  .btn-column button { border: 1px solid #cfd8d2; border-radius: 10px; background: #fff; color: var(--brand-dark); transition: all .15s; }
  .btn-column button:hover { background: var(--brand-soft); border-color: var(--brand); }
  .btn-column button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn-column button.primary:hover { background: var(--brand-dark); }
  .warn-note { color: #b4432f; }
}

}

/* ---------- ローン計算 ---------- */
/**
 * 元利均等返済 月々支払額
 * P: principal, r: monthly rate, n: months
 */
function calcMonthlyPayment(P, r, n){
  if(P <= 0 || n <= 0) return 0;
  if(r === 0) return P / n;
  return P * r * Math.pow(1+r, n) / (Math.pow(1+r, n) - 1);
}

/**
 * 元利均等 償還表を作成
 * @returns [{period, date, principal, interest, payment, balance}, ...]
 */
function amortEqualInstallment(P, rateAnnual, years, execDate, firstPayDate, method='元利均等', bonusMode=false){
  const r = rateAnnual / 12;
  const n = Math.round(years * 12);
  const schedule = [];
  let balance = P;
  let pmt = calcMonthlyPayment(P, r, n);
  const startDate = firstPayDate ? new Date(firstPayDate) : null;
  for(let i=1; i<=n; i++){
    let interest = balance * r;
    let principal;
    if(method === '元金均等'){
      principal = P / n;
      pmt = principal + interest;
    } else {
      principal = pmt - interest;
    }
    if(i === n){ principal = balance; pmt = principal + interest; }
    balance -= principal;
    if(balance < 0) balance = 0;
    const d = startDate ? new Date(startDate.getFullYear(), startDate.getMonth() + (i-1), startDate.getDate()) : null;
    schedule.push({period:i, date:d, principal, interest, payment:pmt, balance});
    if(balance <= 0.01) break;
  }
  return schedule;
}

/**
 * ボーナス払いの償還表 (年2回)
 */
function amortBonus(P, rateAnnual, years, execDate, firstBonusDate){
  const r = rateAnnual / 2;   // 半年利
  const n = Math.round(years * 2);
  const schedule = [];
  let balance = P;
  if(P <= 0 || n <= 0) return schedule;
  const pmt = (r === 0) ? P / n : P * r * Math.pow(1+r, n) / (Math.pow(1+r, n) - 1);
  for(let i=1; i<=n; i++){
    let interest = balance * r;
    let principal = pmt - interest;
    if(i === n){ principal = balance; }
    balance -= principal;
    if(balance < 0) balance = 0;
    schedule.push({period:i, principal, interest, payment: principal + interest, balance});
    if(balance <= 0.01) break;
  }
  return schedule;
}

  let rate = loan.rate_override!=null ? Number(loan.rate_override) : (provider ? Number(provider.rate) : 0);
  if(rate>1) rate = rate/100; // in case entered as 1.5
  // 保証料支払「上乗」の場合は金利に +0.2% 加算（provider の上乗せ不可フラグがない場合）
  if(loan.guarantee_mode === '上乗' && !(provider && provider.no_uwanose)){
    rate = rate + 0.002;
  }
  const method = loan.method || '元利均等';

  // Stage rates for flat 35: preferential rates subtracted from base rate
  const flat_pref = STATE.master.settings.flat_preferential_rate || 0;
  const flat_pref_1_5  = STATE.master.settings.flat_pref_1_5  || 0;
  const flat_pref_6_10 = STATE.master.settings.flat_pref_6_10 || 0;
  const providerType = provider ? (provider.preferential_type || '') : '';
  const providerName = provider ? (provider.name || '') : '';
  const isFlat = /フラット/.test(providerType) || /フラット/i.test(providerName);
  const is5 = /5年優遇/.test(providerType);
  const is10 = /10年優遇/.test(providerType);

  function paymentAt(annualRate){
    if(monthlyP > 0){
      const pmt = calcMonthlyPayment(monthlyP, annualRate/12, years*12);
      return Math.floor(pmt);
    }
    return 0;
  }
  function bonusAt(annualRate){
    if(bonusP > 0){
      const pmt = calcMonthlyPayment(bonusP, annualRate/2, years*2);
      return Math.floor(pmt);
    }
    return 0;
  }

  const stages = [];
  if(isFlat && (flat_pref_1_5 > 0 || flat_pref_6_10 > 0)){
    // フラット35: 3段階 (1-5年, 6-10年, 11年+)
    const r1 = Math.max(0, rate - flat_pref_1_5);
    const r6 = Math.max(0, rate - flat_pref_6_10);
    stages.push({label:'～5年目', years:5, rate:r1, monthly:paymentAt(r1), bonus:bonusAt(r1)});
    stages.push({label:'6〜10年目', years:5, rate:r6, monthly:paymentAt(r6), bonus:bonusAt(r6)});
    stages.push({label:'11年目以降', years:'-', rate:rate, monthly:paymentAt(rate), bonus:bonusAt(rate)});
  } else if(is5){
    stages.push({label:'～5年目', years:5, rate:rate, monthly:paymentAt(rate), bonus:bonusAt(rate)});
    const r2 = rate + flat_pref;
    stages.push({label:'6年目以降', years:'-', rate:r2, monthly:paymentAt(r2), bonus:bonusAt(r2)});
  } else if(is10){
    stages.push({label:'～10年目', years:10, rate:rate, monthly:paymentAt(rate), bonus:bonusAt(rate)});
    const r2 = rate + flat_pref;
    stages.push({label:'11年目以降', years:'-', rate:r2, monthly:paymentAt(r2), bonus:bonusAt(r2)});
  } else {
    stages.push({label:'全期間', years:years, rate:rate, monthly:paymentAt(rate), bonus:bonusAt(rate)});
  }
  return { stages, rate, monthlyP, bonusP, years, method };
}

/**
 * 繰り上げ返済後の効果を計算
 * @returns {null|{type,new_monthly,new_total_years,shortened_months,balance_after}} null=未設定
 */
function calcPrepaymentEffect(loan){
  const P = fmt.flt(loan.monthly_loan) * 10000;
  const years = fmt.flt(loan.years);
  const prepYears = fmt.flt(loan.prepayment_years);
  const prepAmt = fmt.flt(loan.prepayment_man) * 10000;
  if(P <= 0 || years <= 0 || prepYears <= 0 || prepAmt <= 0 || prepYears >= years) return null;
  const provider = findLoan(loan.provider_id);
  let rate = loan.rate_override != null ? Number(loan.rate_override) : (provider ? Number(provider.rate) : 0);
  if(rate > 1) rate = rate / 100;
  if(loan.guarantee_mode === '上乗' && !(provider && provider.no_uwanose)) rate += 0.002;
  const r = rate / 12;
  const n = Math.round(years * 12);
  const nPaid = Math.round(prepYears * 12);
  const nRemain = n - nPaid;
  if(nRemain <= 0) return null;
  // 繰り上げ時点の残高を計算
  const origPmt = calcMonthlyPayment(P, r, n);
  let bal = P;
  for(let m = 0; m < nPaid; m++){
    const interest = bal * r;
    bal = Math.max(0, bal - (origPmt - interest));
  }
  const balAfter = Math.max(0, bal - prepAmt);
  if((loan.prepayment_type || '期間短縮') === '期間短縮'){
    // 月々支払額そのまま → 期間短縮
    if(origPmt <= 0) return null;
    let newN;
    if(r === 0){ newN = Math.ceil(balAfter / origPmt); }
    else {
      const x = 1 - balAfter * r / origPmt;
      if(x <= 0){ newN = 1; }
      else { newN = Math.ceil(-Math.log(x) / Math.log(1 + r)); }
    }
    const shortenedMonths = nRemain - newN;
    return {
      type: '期間短縮',
      new_monthly: Math.floor(origPmt),
      new_total_years: (nPaid + Math.max(1, newN)) / 12,
      shortened_months: Math.max(0, shortenedMonths),
      balance_after: balAfter,
    };
  } else {
    // 残期間そのまま → 月々返済額軽減
    const newMonthly = calcMonthlyPayment(balAfter, r, nRemain);
    return {
      type: '返済額軽減',
      new_monthly: Math.floor(newMonthly),
      new_total_years: years,
      shortened_months: 0,
      balance_after: balAfter,
    };
  }
}

/**
 * 部屋タイプ・間取り文字列からWIC等の付属記述を除去
 */
function stripWic(str){
  return (str||'').replace(/\s*[+\/＋／]?\s*(WIC|SIC|SCL|WCL|CL|WI|DEN|SB|N|S)[^\s]*/gi, '').trim();
}

/**
 * 融資商品名からフリガナ（カナ読み行）を除去して表示用文字列を返す
 */
function loanDisplayName(name){
  if(!name) return '';
  const lines = name.split('\n').map(l => l.trim()).filter(Boolean);
  const isAllKana = l => /^[\u30A0-\u30FF\u3040-\u309F\s・ー]+$/.test(l);
  const hasKanji  = l => /[\u4E00-\u9FFF\u3400-\u4DBF]/.test(l);
  // フリガナ除去: 非カナ行の「後に続く」カナのみ行のみ除去。
  // 先頭のカナのみ行（例: ドコモ・ファイナンス）は銀行名自体なので除去しない。
  const result = [];
  let seenNonKana = false;
  for(const l of lines){
    if(isAllKana(l) && seenNonKana){
      continue; // 非カナ行の後のカナ行 = フリガナ → スキップ
    }
    result.push(l);
    if(!isAllKana(l)) seenNonKana = true;
  }
  const base = result.length > 0 ? result : lines;
  // 末尾カナ除去は「漢字を含む行」のみに適用。
  // カナのみ行（ドコモ・ファイナンス等の銀行名）には適用しない。
  const cleaned = base.map(l => {
    if(!hasKanji(l)) return l;
    l = l.replace(/[\u30A0-\u30FF\u3040-\u309F・ー]{5,}$/, '').trim();
    l = l.replace(/\s+[\u30A0-\u30FF\u3040-\u309F・ー]+$/, '').trim();
    return l;
  }).filter(Boolean);
  return (cleaned.length > 0 ? cleaned : base).join(' ');
}

/**
 * 諸費用計算
 */
function calcMiscFees(){
  const input = STATE.input;
  const settings = STATE.master.settings;
  const property = input.property;
  const price = property.price || 0;
  const tax = property.tax || 0;
  // 売買契約書印紙代は消費税抜き価格（税抜）ベースで計算
  const priceExTax = Math.max(0, price - tax);
  const salesStamp = stampAmount(priceExTax, settings.sale_stamps);
  const rows = [];
  rows.push({label:'売買契約書貼付用印紙代', amount: salesStamp, timing:'売買契約締結時'});

  // 抵当権設定登記費用税率
  const regTaxRate = input.registration_tax_rate || 0.001;

  // Loan-related fees
  const loanRows = [];
  for(let i=0; i<input.loans.length; i++){
    const loan = input.loans[i];
    const provider = findLoan(loan.provider_id);
    if(!provider) continue;
    const monthlyMan = fmt.flt(loan.monthly_loan);
    const bonusMan = fmt.flt(loan.bonus_loan);
    const totalMan = monthlyMan + bonusMan;
    if(totalMan <= 0) continue;
    const totalYen = totalMan * 10000;
    const fee = provider.fee || 0;
    // rate_fee は小数（例: 0.022 = 2.2%）が正規値。旧データで誤カラム読込による大値を防御する
    const rf = provider.rate_fee;
    const rateFeePct = rf ? (rf > 100 ? 0 : rf > 1 ? rf / 100 : rf) : 0;
    const rateFee = rateFeePct ? Math.round(totalYen * rateFeePct) : 0;
    // rate_fee が設定されている場合は割合計算を使用（定額feeへのフォールバックなし）
    const baseFee = rateFeePct ? rateFee : fee;
    const actualFee = Math.max(baseFee, provider.min_fee || 0);
    // guarantee: テーブル値 × (借入額万円 ÷ 100)
    const guar = findGuarantee(provider.id);
    let guarAmt = 0;
    if(guar && loan.guarantee_mode === '一括' && loan.years){
      const yIdx = Math.min(50, Math.max(1, Math.round(fmt.flt(loan.years))));
      const per = guar.fees[yIdx - 1];
      if(per) guarAmt = Math.round(per * (totalMan / 100));
    }
    // stamp
    const stamp = stampAmount(totalYen, settings.loan_stamps);
    // 抵当権設定登記費用 = 借入額 × 登記税率 + 司法書士手数料
    const mortgageRegFee = Math.floor(totalYen * regTaxRate) + (settings.registration_shihou_fee || 0);

    loanRows.push({
      label: loanDisplayName(provider.name) + `　借入金額 ${fmt.num(totalMan)}万円`,
      fee: actualFee,
      guarantee: guarAmt,
      stamp: stamp,
      mortgageRegFee: mortgageRegFee,
      timing: '金融機関指定の期日'
    });
  }

  // 協調融資の手数料を合算: ローン1本目に全手数料を集約し、2本目以降は0にする
  if(input.combine_loan_fees && loanRows.length >= 2){
    const combinedFee = loanRows.reduce((s, r) => s + r.fee, 0);
    loanRows[0].fee = combinedFee;
    for(let j = 1; j < loanRows.length; j++) loanRows[j].fee = 0;
  }

  // Company fee
  const companyFee = settings.company_fee || 0;

  // Fire insurance
  const showFire = input.fire_insurance_display !== '表示しない';
  const fireInsurance = showFire ? (input.type_data.fire_insurance || 0) : 0;

  // Registration (表示登記・保存登記etc)
  const registrationFee = input.type_data.registration_fee || 0;

  // Tax
  const propertyTax = input.type_data.property_tax || 0;
  const showAcqTax = input.acquisition_tax_display !== '表示しない';
  const acquisitionTax = showAcqTax ? (input.type_data.acquisition_tax || 0) : 0;

  // Management
  const managementReserve = input.type_data.management_reserve || 0;
  const repairFund = input.type_data.repair_reserve_fund || 0;

  return {
    salesStamp, loanRows, companyFee, fireInsurance, showFire,
    registrationFee, propertyTax, acquisitionTax, showAcqTax,
    managementReserve, repairFund
  };
}

/* ---------- 総支払額 (毎月) 集計 ---------- */
function calcMonthlyTotal(){
  const input = STATE.input;
  let stage1 = 0, stage2 = 0, stage3 = 0;
  let bonus1 = 0, bonus2 = 0, bonus3 = 0;
  input.loans.forEach(loan => {
    if(!loan.provider_id) return;
    const r = calcLoanExample(loan);
    const s = r.stages;
    if(s.length === 1){
      stage1 += s[0].monthly; stage2 += s[0].monthly; stage3 += s[0].monthly;
      bonus1 += s[0].bonus; bonus2 += s[0].bonus; bonus3 += s[0].bonus;
    } else if(s.length === 2){
      // 5-year type: stage1 = pref, stage2/3 = normal
      const provider = findLoan(loan.provider_id);
      const t = provider ? provider.preferential_type : '';
      if(/5年優遇/.test(t)){
        stage1 += s[0].monthly; stage2 += s[1].monthly; stage3 += s[1].monthly;
        bonus1 += s[0].bonus; bonus2 += s[1].bonus; bonus3 += s[1].bonus;
      } else {
        // 10年優遇 or 未分類: s[0]=当初、s[1]=以降
        stage1 += s[0].monthly; stage2 += s[0].monthly; stage3 += s[1].monthly;
        bonus1 += s[0].bonus; bonus2 += s[0].bonus; bonus3 += s[1].bonus;
      }
    } else if(s.length >= 3){
      // フラット35段階金利等: s[0]=〜5年、s[1]=6〜10年、s[2]=11年〜
      stage1 += s[0].monthly; stage2 += s[1].monthly; stage3 += s[2].monthly;
      bonus1 += s[0].bonus; bonus2 += s[1].bonus; bonus3 += s[2].bonus;
    }
  });
  return { stage1, stage2, stage3, bonus1, bonus2, bonus3 };
}

    b.onclick = () => { input.input_sub_tab = b.dataset.sub; persist(); render(); };
  });
  root.querySelectorAll('.sub-tabs button[data-lsub]').forEach(b => {
    b.onclick = () => { input.loan_sub_tab = b.dataset.lsub; persist(); render(); };
  });

  const bindNoRender = (id, prop, transform) => {
    const el = document.getElementById(id);
    if(!el) return;
    el.onchange = e => {
      let v = e.target.value;
      if(transform) v = transform(v);
      input[prop] = v;
      persist();
    };
  };

  bindNoRender('in_staff', 'staff_id', v => v ? Number(v) : null);
  const roomEl = document.getElementById('in_room');
  if(roomEl){
    roomEl.onchange = e => { input.room = e.target.value ? Number(e.target.value) : null; updateFromRoom(); };
  }
  bindNoRender('in_category', 'category');
  bindNoRender('in_down_payment', 'down_payment_man');
  const combEl = document.getElementById('in_combine_fees');
  if(combEl) combEl.onchange = e => {
    input.combine_loan_fees = e.target.checked;
    // チェック状態変更時はローン手数料・保証料・印紙代の上書きをすべてクリア（合算OFF時の0残存を防ぐ）
    if(input.misc_overrides){
      const keys = Object.keys(input.misc_overrides);
      keys.forEach(k => {
        if(/^loan_\d+_(fee|guarantee|stamp)$/.test(k)) delete input.misc_overrides[k];
      });
    }
    persist(); render();
  };

  const povr = document.getElementById('in_price_override');
  if(povr) povr.onchange = e => { input.price_override_flag = e.target.checked; persist(); render(); };
  bindNoRender('in_price_override_man', 'price_override_man');
  bindNoRender('in_tax_override_man', 'tax_override_man');

  root.querySelectorAll('input[name="fire_ins"]').forEach(r => {
    r.onchange = e => { input.fire_insurance_display = e.target.value; persist(); };
  });
  root.querySelectorAll('input[name="reg_tax"]').forEach(r => {
    r.onchange = e => { input.registration_tax_rate = Number(e.target.value); persist(); };
  });
  root.querySelectorAll('input[name="acq_tax"]').forEach(r => {
    r.onchange = e => { input.acquisition_tax_display = e.target.value; persist(); };
  });
  root.querySelectorAll('input[name="misc_other"]').forEach(r => {
    r.onchange = e => { input.misc_other_display = e.target.value; persist(); };
  });
  bindNoRender('in_parking_monthly', 'parking_monthly');
  const docTypeEl = document.getElementById('in_doc_type');
  if(docTypeEl) docTypeEl.onchange = e => { input.document_type = e.target.value; persist(); };

  bindNoRender('in_memo_body', 'memo_body');
  const memoEl = document.getElementById('in_memo_body');
  if(memoEl) {
    memoEl.addEventListener('keydown', e => {
      if(e.key === 'Enter' && memoEl.value.split('\n').length >= 3) e.preventDefault();
    });
    memoEl.addEventListener('input', () => {
      const lines = memoEl.value.split('\n');
      if(lines.length > 3) {
        memoEl.value = lines.slice(0, 3).join('\n');
        input.memo_body = memoEl.value;
        persist();
      }
    });
  }
  bindNoRender('in_pref_rate', 'pref_rate_cond_pct');
  bindNoRender('in_created_date', 'created_date');
  bindNoRender('in_contact_info', 'contact_info');
  const showPref = document.getElementById('btn_show_pref');
  if(showPref) showPref.onclick = () => toast('民間ローン全期間 ' + (input.pref_rate_cond_pct||0) + '% 金利優遇 適用条件を表示');

  root.querySelectorAll('input[data-ci]').forEach(inp => {
    inp.onchange = () => {
      const i = Number(inp.dataset.ci), k = inp.dataset.ck;
      input.customers[i][k] = inp.value;
      persist(); render();
    };
  });

  root.querySelectorAll('[data-li]').forEach(inp => {
    inp.onchange = () => {
      const i = Number(inp.dataset.li), k = inp.dataset.lk;
      let v = inp.value;
      if(k === '_total'){
        const total = fmt.flt(v);
        const bonus = fmt.flt(input.loans[i].bonus_loan);
        input.loans[i].monthly_loan = Math.max(0, total - bonus);
      } else if(k === 'bonus_loan'){
        // ボーナス変更時は月々分を補正（総借入額を変えない）
        const oldBonus = fmt.flt(input.loans[i].bonus_loan);
        const total = fmt.flt(input.loans[i].monthly_loan) + oldBonus;
        const newBonus = fmt.flt(v);
        input.loans[i].bonus_loan = newBonus;
        input.loans[i].monthly_loan = Math.max(0, total - newBonus);
      } else if(k === 'rate_override'){
        input.loans[i][k] = v===''?null:Number(v)/100;
      } else if(k === 'provider_id'){
        const found = master.loans.find(l => loanDisplayName(l.name) === v.trim());
        input.loans[i].provider_id = found ? found.id : '';
        // 借入先変更時は手数料・保証料・印紙代の上書きをクリア（旧借入先のデータ残留防止）
        if(input.misc_overrides) {
          delete input.misc_overrides[`loan_${i}_fee`];
          delete input.misc_overrides[`loan_${i}_guarantee`];
          delete input.misc_overrides[`loan_${i}_stamp`];
        }
      } else {
        input.loans[i][k] = v;
      }
      if(k === 'provider_id') updateFromProvider(i);
      persist(); render();
    };
  });

  const btn = id => document.getElementById(id);
  if(btn('btn_save'))       btn('btn_save').onclick       = () => { persist(); toast('保存しました'); };
  if(btn('btn_fill_gap'))   btn('btn_fill_gap').onclick   = () => {
    const inp = STATE.input;
    const pm = inp.price_override_flag && inp.price_override_man!==''
      ? fmt.flt(inp.price_override_man)
      : Math.round((inp.property.price||0)/10000);
    const ls = inp.loans.reduce((s,l)=>s+fmt.flt(l.monthly_loan)+fmt.flt(l.bonus_loan), 0);
    const dm = fmt.flt(inp.down_payment_man);
    const gap = pm - dm - ls;
    if(gap > 0){ inp.down_payment_man = String(dm + gap); persist(); render(); }
  };
  if(btn('btn_goto_plan'))  btn('btn_goto_plan').onclick  = () => { STATE.activeTab='plan_staged';  render(); };
  if(btn('btn_goto_plan2')) btn('btn_goto_plan2').onclick = () => { STATE.activeTab='plan_initial'; render(); };
  if(btn('btn_goto_misc'))  btn('btn_goto_misc').onclick  = () => { STATE.activeTab='misc';  render(); };
  if(btn('btn_close'))      btn('btn_close').onclick      = () => { toast('画面を閉じる操作は Excel 版のみです'); };
  if(btn('btn_downpay_info'))btn('btn_downpay_info').onclick = () => {
    alert('頭金計算方法について:\n\n頭金 = 物件価格 - 借入合計\n表示中の 5/10/15/20% は物件価格に対する目安の頭金額です。');
  };
  // サマリー 自動⇄手入力トグル
  if(btn('btn_summary_toggle')) btn('btn_summary_toggle').onclick = () => {
    const inp = STATE.input;
    if(!inp.summary_manual) inp.summary_manual = {};
    const sm = inp.summary_manual;
    if(!sm.enabled) {
      // 手入力モードへ：現在の自動値をプリセット（ステージ別）
      const m = calcMonthlyTotal();
      const td = inp.type_data;
      const r1 = td.repair_reserve_5 || 0;
      sm.enabled        = true;
      sm.loan_monthly_1 = m.stage1 || 0;
      sm.loan_monthly_2 = m.stage2 || 0;
      sm.loan_monthly_3 = m.stage3 || 0;
      sm.bonus_pay      = m.bonus1 || 0;
      sm.management_fee = td.management_fee || 0;
      sm.repair_fee_1   = r1;
      sm.repair_fee_2   = td.repair_reserve_10 || r1;
      sm.repair_fee_3   = td.repair_reserve_11plus || r1;
      sm.misc_total     = (typeof calcMiscFeesTotal === 'function') ? calcMiscFeesTotal() : 0;
    } else {
      // 自動モードへ：手入力値をクリア
      sm.enabled = false;
      sm.loan_monthly_1 = null; sm.loan_monthly_2 = null; sm.loan_monthly_3 = null;
      sm.management_fee = null;
      sm.repair_fee_1 = null; sm.repair_fee_2 = null; sm.repair_fee_3 = null;
      sm.bonus_pay = null; sm.misc_total = null;
    }
    persist(); render();
  };
  // 手入力フィールド共通ハンドラ
  function wireSumField(id, key) {
    const el = btn(id);
    if(!el) return;
    el.onchange = () => {
      const v = Math.round(Number(String(el.value).replace(/[^0-9.-]/g,''))||0);
      if(!STATE.input.summary_manual) STATE.input.summary_manual = {};
      STATE.input.summary_manual[key] = v;
      persist(); render();
    };
    el.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); el.blur(); } });
  }
  wireSumField('sum_loan_1',    'loan_monthly_1');
  wireSumField('sum_loan_2',    'loan_monthly_2');
  wireSumField('sum_loan_3',    'loan_monthly_3');
  wireSumField('sum_management','management_fee');
  wireSumField('sum_repair_1',  'repair_fee_1');
  wireSumField('sum_repair_2',  'repair_fee_2');
  wireSumField('sum_repair_3',  'repair_fee_3');
  wireSumField('sum_bonus',     'bonus_pay');
  wireSumField('sum_misc',      'misc_total');
  root.querySelectorAll('button[data-loan]').forEach(b => {
    b.onclick = () => { STATE.activeTab='loans'; render(); };
  });
}

/* ---------- 日付フォーマット ---------- */
function formatDateJP(d){
  if(!d) return '';
  const m = d.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m ? m[1]+'年'+parseInt(m[2])+'月'+parseInt(m[3])+'日' : d;
}

/* ---------- 資金計画出力 ---------- */
function renderPlan(root, mode){
  mode = mode || 'staged';
  const isInitial = mode === 'initial';
  root.classList.remove('plan-initial-mode', 'plan-staged-mode');
  root.classList.add(isInitial ? 'plan-initial-mode' : 'plan-staged-mode');
  const input = STATE.input;
  const master = STATE.master;
  const staff = (master.staff||[]).find(s => String(s.id) === String(input.staff_id));
  const staffName = staff ? staff.name : '';
  const projectName = master.settings.project_name || '';
  const monthly = calcMonthlyTotal();
  const dispDeduction = master.settings.tax_deduction_display !== '表示しない';
  const misc_display = master.settings.misc_display || '表示する';
  const showMisc6 = misc_display !== '6年目以降表示しない';
  const showMisc11 = misc_display !== '11年目以降表示しない' && showMisc6;

  const optionalItems = master.settings.misc_optional_items || [];
  const misc = input.type_data;
  const _sm = input.summary_manual || {};
  const _isManual = _sm.enabled === true;
  const managementFee = (_isManual && _sm.management_fee !== null) ? _sm.management_fee : (misc.management_fee || 0);
  const optionalTotal = optionalItems.reduce((s,x)=>s+(x.amount||0),0);
  const gardenFee = misc.garden_fee || 0;
  const roofFee = misc.roof_balcony_fee || 0;

  function calcMisc(stage){
    let repair_auto;
    if(stage === 1) repair_auto = misc.repair_reserve_5;
    else if(stage === 2) repair_auto = misc.repair_reserve_10 || misc.repair_reserve_5;
    else repair_auto = misc.repair_reserve_11plus || misc.repair_reserve_5;
    let repair;
    if(stage === 1)      repair = (_isManual && _sm.repair_fee_1 !== null) ? _sm.repair_fee_1 : (repair_auto || 0);
    else if(stage === 2) repair = (_isManual && _sm.repair_fee_2 !== null) ? _sm.repair_fee_2 : (repair_auto || 0);
    else                 repair = (_isManual && _sm.repair_fee_3 !== null) ? _sm.repair_fee_3 : (repair_auto || 0);
    const showOther = (input.misc_other_display || '表示する') !== '表示しない';
    return {
      management: managementFee,
      repair: repair,
      optional: showOther && (stage===1 || (stage===2 && showMisc6) || (stage===3 && showMisc11)) ? optionalTotal : 0,
      garden: showOther ? gardenFee : 0,
      roof: showOther ? roofFee : 0
    };
  }
  const m1 = calcMisc(1), m2 = calcMisc(2), m3 = calcMisc(3);
  const planMonthly = {
    stage1: (_isManual && _sm.loan_monthly_1 !== null) ? _sm.loan_monthly_1 : monthly.stage1,
    stage2: (_isManual && _sm.loan_monthly_2 !== null) ? _sm.loan_monthly_2 : monthly.stage2,
    stage3: (_isManual && _sm.loan_monthly_3 !== null) ? _sm.loan_monthly_3 : monthly.stage3,
    bonus1: (_isManual && _sm.bonus_pay !== null) ? _sm.bonus_pay : (monthly.bonus1 || 0),
    bonus2: (_isManual && _sm.bonus_pay !== null) ? _sm.bonus_pay : (monthly.bonus2 || 0),
    bonus3: (_isManual && _sm.bonus_pay !== null) ? _sm.bonus_pay : (monthly.bonus3 || 0),
  };
  const bicycleEntries  = (master.settings.bicycle  ||[]).filter(r=>r.fee>0);
  const motorbikeEntries= (master.settings.motorbike||[]).filter(r=>r.fee>0);
  const parkingEntries  = (master.settings.parking  ||[]).filter(r=>r.fee>0);
  const settingsParkingYen = [...bicycleEntries, ...motorbikeEntries, ...parkingEntries].reduce((s, r) => s + (r.fee || 0), 0);
  const parkingYen = fmt.flt(input.parking_monthly) || settingsParkingYen;
  const _pkSections = [bicycleEntries.length>0, motorbikeEntries.length>0, parkingEntries.length>0].filter(Boolean).length;
  const parkingPanelHtml = _pkSections > 0 ? `
    <div class="fund-panel parking-panel" style="font-size:10px;">
      <div style="display:grid;grid-template-columns:repeat(${_pkSections},1fr);gap:6px;align-items:start;">
        ${bicycleEntries.length ? `<div><div style="font-weight:700;margin-bottom:3px;">●駐輪場利用料</div>${bicycleEntries.map(r=>`<div style="display:flex;justify-content:space-between;gap:4px;margin:2px 0;"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${r.label||''}</span><span style="white-space:nowrap;">${fmt.yen(r.fee)}</span></div>`).join('')}</div>`:``}
        ${motorbikeEntries.length ? `<div><div style="font-weight:700;margin-bottom:3px;">●バイク置場利用料</div>${motorbikeEntries.map(r=>`<div style="display:flex;justify-content:space-between;gap:4px;margin:2px 0;"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${r.label||''}</span><span style="white-space:nowrap;">${fmt.yen(r.fee)}</span></div>`).join('')}</div>`:``}
        ${parkingEntries.length ? `<div><div style="font-weight:700;margin-bottom:3px;">●駐車場利用料</div>${parkingEntries.map(r=>`<div style="display:flex;justify-content:space-between;gap:4px;margin:2px 0;"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${r.label||''}</span><span style="white-space:nowrap;">${fmt.yen(r.fee)}</span></div>`).join('')}</div>`:``}
      </div>
    </div>` : '';

  // 手打ち上書きヘルパー（資金計画）
  const pov = input.plan_overrides || {};
  function povAmt(key, val){ return (pov[key]&&pov[key].amount!==undefined) ? pov[key].amount : val; }
  function povLabel(key, val){ return (pov[key]&&pov[key].label!==undefined) ? pov[key].label : val; }

  const monthly1 = planMonthly.stage1 + povAmt('management',m1.management) + povAmt('repair',m1.repair) + (m1.garden>0?povAmt('garden',gardenFee):0) + (m1.roof>0?povAmt('roof',roofFee):0) + m1.optional;
  const monthly2 = planMonthly.stage2 + povAmt('management',m2.management) + povAmt('repair',m2.repair) + (m2.garden>0?povAmt('garden',gardenFee):0) + (m2.roof>0?povAmt('roof',roofFee):0) + m2.optional;
  const monthly3 = planMonthly.stage3 + povAmt('management',m3.management) + povAmt('repair',m3.repair) + (m3.garden>0?povAmt('garden',gardenFee):0) + (m3.roof>0?povAmt('roof',roofFee):0) + m3.optional;

  const priceManBase2 = Math.floor((input.property.price || 0) / 10000);
  const taxYenBase2   = input.property.tax || 0;
  const priceMan = (input.price_override_flag && input.price_override_man!=='') ? fmt.flt(input.price_override_man) : priceManBase2;
  const taxYen   = (input.price_override_flag && input.tax_override_man!=='')   ? fmt.flt(input.tax_override_man)*10000 : taxYenBase2;
  const taxMan   = Math.floor(taxYen / 10000);
  // 消費税を万円＋千円まで表示する書式: 例 96万5千円
  function fmtTaxYen(yen){ const m=Math.floor(yen/10000), s=Math.floor((yen%10000)/1000); return s>0?fmt.num(m)+'万'+s+'千円':fmt.num(m)+'万円'; }
  // 頭金: 計算スタートの down_payment_man を優先、なければ顧客個別合計
  const downSum = input.down_payment_man !== '' && input.down_payment_man != null
    ? fmt.flt(input.down_payment_man)
    : input.customers.reduce((s,c)=>s+fmt.flt(c.down),0);
  const remainder = priceMan - downSum;
  const isOverLoan = remainder < 0;

  const c = input.customers;
  const totalIncome = c.reduce((s,x)=>s+fmt.flt(x.income),0);

  root.innerHTML = `
    <h2 class="section-title no-print">${isInitial?'資金計画出力（当初支払のみ）':'資金計画出力（段階金利）'}</h2>
    <div class="actions">
      <button class="btn ghost" onclick="window.print()">印刷</button>
    </div>

    <div class="card fund-plan">
      <h1>資金計画書 ${isInitial?'<span style="font-size:14px;color:#8894a7">（当初支払のみ）</span>':'<span style="font-size:14px;color:#8894a7">（段階金利）</span>'}</h1>
      ${input.document_type ? `<div style="display:inline-block;background:#e8f0fb;border:1.5px solid #3a7bd5;border-radius:4px;padding:2px 14px;font-size:13px;font-weight:700;color:#1a4a90;margin-bottom:6px;">${input.document_type}</div>` : ''}
      ${(projectName || staffName) ? `<div style="font-size:12px;color:#556274;margin-bottom:2px;">${projectName ? '物件名: '+projectName : ''}${projectName && staffName ? '　' : ''}${staffName ? '担当者: '+staffName : ''}${master.settings.sales_tel ? '　販売センター TEL: '+master.settings.sales_tel : ''}</div>` : ''}
      ${(input.created_date || input.contact_info) ? `<div style="font-size:12px;color:#556274;margin-bottom:10px;">${input.created_date?'作成日: '+formatDateJP(input.created_date)+' ':''} ${input.contact_info?'連絡先: '+input.contact_info:''}</div>` : ''}
      <div class="fund-summary fund-summary-top">
        <div class="fund-panel" style="padding-bottom:14px;">
          <h3>ご購入者情報</h3>
          ${c.filter(x=>x.name).map((x,i)=>`
            <div class="row">
              <span class="lbl">お客様${i+1}</span>
              <span>${x.name} 様 / ${x.age||'-'} 歳 / 年収 ${fmt.num(x.income)} 万円</span>
            </div>`).join('') || '<div class="muted">顧客情報未入力</div>'}
          <div class="row">
            <span class="lbl">合算年収</span>
            <span class="money-strong">${fmt.num(totalIncome)} 万円</span>
          </div>
        </div>

        <div class="fund-panel" style="padding-bottom:14px;">
          <div class="row"><span class="lbl">部屋番号</span><span>${input.room||'-'}</span></div>
          <div class="row"><span class="lbl">タイプ・間取り</span><span>${input.property.type ? input.property.type+' Type' : '-'} ${stripWic(input.property.layout)}</span></div>
          <div class="row"><span class="lbl">専有面積</span><span>${input.property.private_area||''}㎡</span></div>
          <div class="row"><span class="lbl">${master.settings.price_notation||'物件価格'}</span><span class="money-strong">${fmt.num(priceMan)} 万円</span></div>
          <div class="row"><span class="lbl"></span><span class="muted" style="font-size:11px;">（内消費税 ${taxYen>0?fmtTaxYen(taxYen):'不明'}）</span></div>
          <div class="row"><span class="lbl">自己資金</span><span>${fmt.num(downSum)} 万円</span></div>
          <div class="row"><span class="lbl">残金</span><span class="${isOverLoan?'':'money-strong'}" style="${isOverLoan?'color:#b93131;font-weight:700':''}">
            ${isOverLoan ? '0 万円（オーバーローン +'+fmt.num(-remainder)+'万円）' : fmt.num(remainder)+' 万円'}
          </span></div>
        </div>
      </div>

      <div class="output-header" style="margin-top:12px;">${isInitial?'お支払例（当初支払のみ）（Ａ）':'お支払例（段階金利対応）（Ａ）'}</div>
      <div class="scroll-x">
        <table class="data-table stage-rate">
          <thead>
            ${isInitial ? `
            <tr>
              <th rowspan="2">融資分類</th>
              <th rowspan="2">金利</th>
              <th rowspan="2">返済年数</th>
              <th rowspan="2">借入金額</th>
              <th colspan="2">当初支払</th>
            </tr>
            <tr>
              <th>毎月払い</th><th>ボーナス払い（1回あたり）</th>
            </tr>
            ` : `
            <tr>
              <th rowspan="2">融資分類</th>
              <th rowspan="2">金利</th>
              <th rowspan="2">返済年数</th>
              <th rowspan="2">借入金額</th>
              <th colspan="2">当初〜5年目</th>
              <th colspan="2">6年目〜10年目</th>
              <th colspan="2">11年目以降</th>
            </tr>
            <tr>
              <th>毎月払い</th><th>ボーナス払い（1回あたり）</th>
              <th>毎月払い</th><th>ボーナス払い（1回あたり）</th>
              <th>毎月払い</th><th>ボーナス払い（1回あたり）</th>
            </tr>
            `}
          </thead>
          <tbody id="loans-plan"></tbody>
          ${isInitial ? (()=>{
            const fixedTotal1 = monthly1 - planMonthly.stage1;
            return `

  function setupPlanCeInput(inp){
    inp.addEventListener('focus', () => {
      const raw = Number((inp.value||'').replace(/[^0-9.-]/g,''));
      inp.value = isNaN(raw) ? '' : raw;
      inp.select();
    });
    inp.addEventListener('blur', () => {
      const key = inp.dataset.key;
      const def = Number(inp.dataset.def||0);
      const raw = inp.value.trim();
      if(!input.plan_overrides) input.plan_overrides = {};
      if(raw === '' || isNaN(Number(raw))){
        delete input.plan_overrides[key];
        inp.value = fmt.yen(def);
      } else {
        const v = Number(raw);
        if(!input.plan_overrides[key]) input.plan_overrides[key] = {};
        input.plan_overrides[key].amount = v;
        inp.value = fmt.yen(v);
      }
      persist();
      recalcPlanTotals(root);
    });
    inp.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } });
  }
  root.querySelectorAll('input.ce-amt[data-ctx="plan"]').forEach(setupPlanCeInput);
  root.querySelectorAll('input.ce-lbl[data-ctx="plan"]').forEach(inp => {
    inp.addEventListener('blur', () => {
      const key = inp.dataset.key;
      if(!input.plan_overrides) input.plan_overrides = {};
      if(!input.plan_overrides[key]) input.plan_overrides[key] = {};

  // 金融機関名 手打ち編集ハンドラ
  root.querySelectorAll('input.loan-name-edit').forEach(inp => {

    inp.addEventListener('mouseenter', () => { inp.style.borderColor = '#cfd6e2'; inp.style.background = '#fff'; });
    inp.addEventListener('mouseleave', () => { if(document.activeElement !== inp){ inp.style.borderColor = 'transparent'; inp.style.background = 'transparent'; } });
  });
}

/* ---------- 手打ち編集：合計再計算 ---------- */
function recalcMiscTotals(root){
  function rv(key){
    const inp = root.querySelector(`input.ce-amt[data-key="${key}"]`);
    if(!inp) return 0;
    return Number((inp.value||'').replace(/[^0-9.-]/g,'')) || 0;
  }
  let newSubA = rv('sales_stamp') + rv('company_fee') + rv('fire_insurance');
  let i = 0;
  while(root.querySelector(`input.ce-amt[data-key="loan_${i}_fee"]`)){
    newSubA += rv(`loan_${i}_fee`) + rv(`loan_${i}_guarantee`) + rv(`loan_${i}_stamp`);
    i++;
  }
  const newSubB = rv('registration_fee') + rv('mortgage_reg') + rv('property_tax') + rv('acquisition_tax');
  const newSubC = rv('repair_fund') + rv('management_reserve');
  const newTotal = newSubA + newSubB + newSubC;
  const sa = root.querySelector('#misc-sub-a'); if(sa) sa.textContent = fmt.yen(newSubA);
  const sb = root.querySelector('#misc-sub-b'); if(sb) sb.textContent = fmt.yen(newSubB);
  const sc = root.querySelector('#misc-sub-c'); if(sc) sc.textContent = fmt.yen(newSubC);
  const tot = root.querySelector('#misc-total'); if(tot) tot.textContent = fmt.yen(newTotal);
}
function recalcPlanTotals(root){
  function pv(key){
    const inp = root.querySelector(`input.ce-amt[data-ctx="plan"][data-key="${key}"]`);
    return inp ? (Number((inp.value||'').replace(/[^0-9.-]/g,''))||0) : 0;
  }
  function loanSub(n){ const el=root.querySelector(`#plan-loan-sub-${n}`); return el?(Number(el.dataset.val)||0):0; }
  const planInps = root.querySelectorAll('input.ce-amt[data-ctx="plan"]');
  const keys = [...new Set([...planInps].map(x=>x.dataset.key))];
  const editableSum = keys.reduce((s,k)=>s+pv(k), 0);
  for(let n=1;n<=3;n++){
    // optional items (non-editable) stored in data-optional on the fixed-sub cell
    const fixedSubEl = root.querySelector(`#plan-fixed-sub-${n}`);
    const optAmt = fixedSubEl ? (Number(fixedSubEl.dataset.optional)||0) : 0;
    const totalFixed = editableSum + optAmt;
    if(fixedSubEl) fixedSubEl.textContent = fmt.yen(totalFixed);
    const fixedBEl = root.querySelector(`#plan-fixed-b-${n}`);
    if(fixedBEl) fixedBEl.textContent = fmt.yen(totalFixed);
    const el = root.querySelector(`#plan-monthly-total-${n}`);
    if(el) el.textContent = fmt.yen(loanSub(n) + totalFixed);
  }
}

function calcMiscFeesTotal(){
  const f = calcMiscFees();
  let total = f.salesStamp + f.companyFee + f.fireInsurance + f.registrationFee + f.propertyTax + f.acquisitionTax + f.managementReserve + f.repairFund;
  for(const l of f.loanRows) total += l.fee + l.guarantee + l.stamp + l.mortgageRegFee;
  return total;
}

  // 手打ち編集イベント設定
  function setupCeInput(inp){
    inp.addEventListener('focus', () => {
      const raw = Number((inp.value||'').replace(/[^0-9.-]/g,''));
      inp.value = isNaN(raw) ? '' : raw;
      inp.select();
    });
    inp.addEventListener('blur', () => {
      const key = inp.dataset.key;
      const def = Number(inp.dataset.def||0);
      const raw = inp.value.trim();
      if(!input.misc_overrides) input.misc_overrides = {};
      if(raw === '' || isNaN(Number(raw))){
        delete input.misc_overrides[key];
        inp.value = fmt.yen(def);
      } else {
        const v = Number(raw);
        if(!input.misc_overrides[key]) input.misc_overrides[key] = {};
        input.misc_overrides[key].amount = v;
        inp.value = fmt.yen(v);
      }
      persist();
      recalcMiscTotals(root);
    });
    inp.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } });
  }
  root.querySelectorAll('input.ce-amt').forEach(setupCeInput);
  root.querySelectorAll('input.ce-lbl').forEach(inp => {
    inp.addEventListener('blur', () => {
      const key = inp.dataset.key;
      if(!input.misc_overrides) input.misc_overrides = {};
      if(!input.misc_overrides[key]) input.misc_overrides[key] = {};
      input.misc_overrides[key].label = inp.value;
      persist();
    });
  });
}

/* ---------- 住宅ローン計算タブ ---------- */
function buildLoanCharts(monthlySchedule, bonusSchedule, years){
  // Aggregate to yearly principal, interest, and end-of-year balance
  const yearly = [];
  const totalYears = Math.max(1, Math.ceil(monthlySchedule.length / 12));
  for(let y=0; y<totalYears; y++){
    let prin=0, intr=0, bal=0;
    for(let m=0; m<12; m++){
      const idx = y*12 + m;
      const row = monthlySchedule[idx];
      if(row){
        prin += row.principal || 0;
        intr += row.interest  || 0;
        bal   = row.balance   || 0;
      }
    }
    // Add bonus for this year (2 payments per year)
    for(let b=0; b<2; b++){
      const bIdx = y*2 + b;
      if(bonusSchedule[bIdx]){
        prin += bonusSchedule[bIdx].principal || 0;
        intr += bonusSchedule[bIdx].interest  || 0;
      }
    }
    yearly.push({year: y+1, principal: prin, interest: intr, balance: bal});
  }

  const maxPay = Math.max(1, ...yearly.map(y => y.principal + y.interest));
  const maxBal = Math.max(1, ...yearly.map(y => y.balance));

  // ---- Chart 1: Balance line ----
  const W = 460, H = 200, PAD_L = 55, PAD_R = 12, PAD_T = 20, PAD_B = 30;
  const innerW = W - PAD_L - PAD_R, innerH = H - PAD_T - PAD_B;
  const xFor = i => PAD_L + (yearly.length<=1 ? innerW/2 : (i / (yearly.length-1)) * innerW);
  const yBal = v => PAD_T + innerH - (v / maxBal) * innerH;

  // Y-axis ticks for balance
  const balTicks = 5;
  const balAxis = [];
  for(let t=0; t<=balTicks; t++){
    const v = maxBal * (balTicks-t) / balTicks;
    const y = PAD_T + (t/balTicks) * innerH;
    balAxis.push({v, y});
  }
  const balPoints = yearly.map((y,i)=>`${xFor(i)},${yBal(y.balance)}`).join(' ');
  const balArea = `${PAD_L},${PAD_T+innerH} ${balPoints} ${xFor(yearly.length-1)},${PAD_T+innerH}`;

  const xLabels = yearly.filter((_,i)=> i%Math.ceil(yearly.length/8)===0 || i===yearly.length-1);

  const chart1 = `
    <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="background:#fff;border:1px solid #dde3ee;">
      <!-- Y grid -->
      ${balAxis.map(t=>`<line x1="${PAD_L}" y1="${t.y}" x2="${W-PAD_R}" y2="${t.y}" stroke="#eaecef"/>`).join('')}
      <!-- Y labels -->
      ${balAxis.map(t=>`<text x="${PAD_L-4}" y="${t.y+4}" text-anchor="end" font-size="10" fill="#556274">${fmt.num(Math.round(t.v/10000))}</text>`).join('')}
      <text x="${PAD_L-4}" y="${PAD_T-6}" text-anchor="end" font-size="9" fill="#8894a7">万円</text>
      <!-- Filled area -->
      <polygon points="${balArea}" fill="#24476f" opacity="0.15"/>
      <!-- Line -->
      <polyline points="${balPoints}" fill="none" stroke="#24476f" stroke-width="2"/>
      <!-- Points -->
      ${yearly.map((y,i)=>`<circle cx="${xFor(i)}" cy="${yBal(y.balance)}" r="2" fill="#24476f"/>`).join('')}
      <!-- X axis -->
      <line x1="${PAD_L}" y1="${PAD_T+innerH}" x2="${W-PAD_R}" y2="${PAD_T+innerH}" stroke="#8894a7"/>
      ${xLabels.map(y=>`<text x="${xFor(y.year-1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#556274">${y.year}年</text>`).join('')}
      <!-- Title -->
      <text x="${PAD_L}" y="14" font-size="11" fill="#24476f" font-weight="600">残高推移 (年末時点)</text>
    </svg>
  `;

  // ---- Chart 2: Stacked bar principal/interest per year ----
  const W2 = 460, H2 = 200, PAD_L2 = 55, PAD_R2 = 12, PAD_T2 = 20, PAD_B2 = 30;
  const innerW2 = W2 - PAD_L2 - PAD_R2, innerH2 = H2 - PAD_T2 - PAD_B2;
  const barGap = 1;
  const barW = Math.max(2, (innerW2 / yearly.length) - barGap);
  const yPay = v => PAD_T2 + innerH2 - (v / maxPay) * innerH2;
  const payTicks = 5;
  const payAxis = [];
  for(let t=0; t<=payTicks; t++){
    const v = maxPay * (payTicks-t) / payTicks;
    const y = PAD_T2 + (t/payTicks) * innerH2;
    payAxis.push({v, y});
  }

  const bars = yearly.map((y,i) => {
    const x = PAD_L2 + i * (barW + barGap);
    const hIntr = (y.interest / maxPay) * innerH2;
    const hPrin = (y.principal / maxPay) * innerH2;
    const yIntr = PAD_T2 + innerH2 - hIntr;
    const yPrin = yIntr - hPrin;
    return `
      <rect x="${x}" y="${yPrin}" width="${barW}" height="${hPrin}" fill="#24476f"/>
      <rect x="${x}" y="${yIntr}" width="${barW}" height="${hIntr}" fill="#b93131"/>
    `;
  }).join('');

  const chart2 = `
    <svg width="${W2}" height="${H2}" viewBox="0 0 ${W2} ${H2}" style="background:#fff;border:1px solid #dde3ee;">
      ${payAxis.map(t=>`<line x1="${PAD_L2}" y1="${t.y}" x2="${W2-PAD_R2}" y2="${t.y}" stroke="#eaecef"/>`).join('')}
      ${payAxis.map(t=>`<text x="${PAD_L2-4}" y="${t.y+4}" text-anchor="end" font-size="10" fill="#556274">${fmt.num(Math.round(t.v/10000))}</text>`).join('')}
      <text x="${PAD_L2-4}" y="${PAD_T2-6}" text-anchor="end" font-size="9" fill="#8894a7">万円</text>
      ${bars}
      <line x1="${PAD_L2}" y1="${PAD_T2+innerH2}" x2="${W2-PAD_R2}" y2="${PAD_T2+innerH2}" stroke="#8894a7"/>
      ${xLabels.map(y=>`<text x="${PAD_L2 + (y.year-1) * (barW+barGap) + barW/2}" y="${H2-8}" text-anchor="middle" font-size="10" fill="#556274">${y.year}年</text>`).join('')}
      <text x="${PAD_L2}" y="14" font-size="11" fill="#24476f" font-weight="600">年別 元金／利息 内訳</text>
      <!-- Legend -->
      <g transform="translate(${W2-140}, 14)">
        <rect x="0" y="-8" width="10" height="10" fill="#24476f"/>
        <text x="14" y="1" font-size="10" fill="#556274">元金</text>
        <rect x="55" y="-8" width="10" height="10" fill="#b93131"/>
        <text x="69" y="1" font-size="10" fill="#556274">利息</text>
      </g>
    </svg>
  `;

  return `<div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;">${chart1}${chart2}</div>`;
}

function renderLoansCalc(root){
  const input = STATE.input;
  root.innerHTML = `
    <h2 class="section-title">住宅ローン計算（償還表）</h2>
    <div class="actions">
      <button class="btn ghost" onclick="window.print()">印刷</button>
    </div>
    <div id="loans-details"></div>
  `;
  const container = document.getElementById('loans-details');

  input.loans.forEach((loan, i) => {
    const provider = findLoan(loan.provider_id);
    const monthlyMan = fmt.flt(loan.monthly_loan);
    const bonusMan = fmt.flt(loan.bonus_loan);
    if(!provider && loan.rate_override == null) return;
    if(monthlyMan === 0 && bonusMan === 0) return;
    const monthlyP = monthlyMan * 10000;
    const bonusP = bonusMan * 10000;
    const years = fmt.flt(loan.years);
    let rate = loan.rate_override!=null ? Number(loan.rate_override) : Number(provider.rate);

    // Build schedules (with prepayment support)
    let monthlySchedule, bonusSchedule;
    const prepEffect = calcPrepaymentEffect(loan);
    if(prepEffect){
      const nPaid = Math.round(fmt.flt(loan.prepayment_years) * 12);
      const prepAmt = fmt.flt(loan.prepayment_man) * 10000;
      const fullSchedule = amortEqualInstallment(monthlyP, rate, years, loan.exec_date, null, loan.method);
      const phase1 = fullSchedule.slice(0, nPaid);
      const balAfter = Math.max(0, (phase1.length > 0 ? phase1[phase1.length-1].balance : monthlyP) - prepAmt);
      const phase2Years = prepEffect.type === '期間短縮'
        ? Math.max(1/12, prepEffect.new_total_years - nPaid/12)
        : Math.max(1/12, years - nPaid/12);
      const phase2 = amortEqualInstallment(balAfter, rate, phase2Years, null, null, loan.method);
      phase2.forEach((row, idx) => { row.period = nPaid + 1 + idx; row.isPostPrepay = true; });
      monthlySchedule = [...phase1, {isPrepayment:true, prepAmt, balance:balAfter}, ...phase2];
      bonusSchedule = amortBonus(bonusP, rate, years, loan.exec_date, null);
    } else {
      monthlySchedule = amortEqualInstallment(monthlyP, rate, years, loan.exec_date, null, loan.method);
      bonusSchedule = amortBonus(bonusP, rate, years, loan.exec_date, null);
    }

    // Combine schedules into monthly view (bonus paid every 6 months)
    const normalRows = monthlySchedule.filter(r => !r.isPrepayment);
    const totalIntM = normalRows.reduce((s,x)=>s+x.interest,0);
    const totalIntB = bonusSchedule.reduce((s,x)=>s+x.interest,0);
    const totalMon = normalRows.reduce((s,x)=>s+x.payment,0);
    const totalBon = bonusSchedule.reduce((s,x)=>s+x.payment,0);

    // Pre-compute display rows with bonus index mapped correctly
    let _mIdx = 0;
    const displayRows = monthlySchedule.map(row => {
      if(row.isPrepayment) return row;
      const bonIdx = Math.floor(_mIdx / 6);
      const bon = (_mIdx % 6 === 5) && bonusSchedule[bonIdx] ? bonusSchedule[bonIdx] : null;
      const totalBonBal = bonusSchedule[bonIdx] ? bonusSchedule[bonIdx].balance : 0;
      _mIdx++;
      return {...row, _bon:bon, _totalBal:row.balance + totalBonBal};
    });

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h3>借入 ${i+1}: ${provider ? loanDisplayName(provider.name) : '借入先 '+(i+1)}</h3>
      <div class="grid cols-4">
        <div class="field"><label>借入額（月々）</label><input readonly value="${fmt.yen(monthlyP)}"></div>
        <div class="field"><label>借入額（ボーナス）</label><input readonly value="${fmt.yen(bonusP)}"></div>
        <div class="field"><label>返済年数</label><input readonly value="${fmt.num(years)} 年"></div>
        <div class="field"><label>金利</label><input readonly value="${fmt.pct(rate,3)}"></div>
        <div class="field"><label>返済方法</label><input readonly value="${loan.method||'元利均等'}"></div>
        <div class="field"><label>融資実行日</label><input readonly value="${loan.exec_date||'-'}"></div>
        <div class="field"><label>団信</label><input readonly value="${loan.dansin||'あり'}"></div>
      </div>
      <div class="hr"></div>
      <div class="grid cols-4">
        <div class="field"><label>総返済額</label><input readonly value="${fmt.yen(totalMon + totalBon)}"></div>
        <div class="field"><label>（内 利息分）</label><input readonly value="${fmt.yen(totalIntM + totalIntB)}"></div>
        <div class="field"><label>月々合計</label><input readonly value="${fmt.yen(totalMon)}"></div>
        <div class="field"><label>ボーナス合計</label><input readonly value="${fmt.yen(totalBon)}"></div>
      </div>
      <div class="hr"></div>
      ${buildLoanCharts(normalRows, bonusSchedule, years)}
      <div class="scroll-x loan-table-scroll" style="max-height:400px">
        <table class="data-table">
          <thead><tr>
            <th>回</th><th>返済日</th><th>元金</th><th>利息</th><th>返済額</th>
            <th>月々</th><th>ボーナス</th><th>残高</th>
          </tr></thead>
          <tbody>
            ${displayRows.map(row => {
              if(row.isPrepayment) return `<tr style="background:#fff3e0;color:#b45309;font-weight:600;border-top:2px solid #f59e0b;border-bottom:2px solid #f59e0b;">
                <td colspan="2" style="text-align:center;">★ 繰上返済</td>
                <td colspan="3" style="text-align:center;">${fmt.yen(row.prepAmt)}</td>
                <td></td><td></td>
                <td>${fmt.yen(row.balance)}</td>
              </tr>`;
              return `<tr${row.isPostPrepay ? ' style="background:#eff6ff;"' : ''}>
                <td>${row.period}</td>
                <td>${row.date ? fmtDate(row.date) : ''}</td>
                <td>${fmt.yen(row.principal + (row._bon?row._bon.principal:0))}</td>
                <td>${fmt.yen(row.interest + (row._bon?row._bon.interest:0))}</td>
                <td>${fmt.yen(row.payment + (row._bon?row._bon.payment:0))}</td>
                <td>${fmt.yen(row.payment)}</td>
                <td>${row._bon ? fmt.yen(row._bon.payment) : ''}</td>
                <td>${fmt.yen(row._totalBal)}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;
    container.appendChild(card);
  });

  if(!container.children.length){
    container.innerHTML = '<div class="card muted">借入情報が入力されていません。「計算スタート」タブで借入先を選択してください。</div>';
  }
}
