/* ---------- チェックボックス一括削除ヘルパー ---------- */
function wireCheckboxes(prefix, arr){
  const body = document.getElementById(prefix+'-body');
  if(!body) return;
  const delBtn = document.getElementById(prefix+'-del-sel');
  const allCb  = document.getElementById(prefix+'-chk-all');
  const updateCount = () => {
    const n = body.querySelectorAll('.row-cb:checked').length;
    if(delBtn){ delBtn.textContent = n>0 ? `選択削除 (${n}件)` : '選択削除'; delBtn.disabled = n===0; }
    if(allCb){ const all = body.querySelectorAll('.row-cb'); allCb.indeterminate = n>0 && n<all.length; allCb.checked = n>0 && n===all.length; }
  };
  body.querySelectorAll('.row-cb').forEach(cb => { cb.onchange = updateCount; });
  if(allCb) allCb.onchange = () => { body.querySelectorAll('.row-cb').forEach(cb => cb.checked=allCb.checked); updateCount(); };
  if(delBtn) delBtn.onclick = () => {
    const indices = [...body.querySelectorAll('.row-cb:checked')].map(cb=>+cb.dataset.i);
    if(!indices.length) return;
    if(!confirm(`選択した${indices.length}件を削除しますか？`)) return;
    indices.sort((a,b)=>b-a).forEach(i => arr.splice(i,1));
    persist(); render();
  };
}

/* ---------- xlsx インポート共通パーサー ---------- */
async function parseXlsxToArray(file) {
  const buf = await file.arrayBuffer();
  const view = new DataView(buf);
  const u8 = new Uint8Array(buf);
  const dec = new TextDecoder();
  const entries = {};
  let i = 0;
  const TARGETS = new Set(['xl/sharedStrings.xml','xl/worksheets/sheet1.xml']);
  while (i < buf.byteLength - 30) {
    if (view.getUint32(i, true) !== 0x04034b50) { i++; continue; }
    const flags = view.getUint16(i+6, true);
    const comp  = view.getUint16(i+8, true);
    const csize = view.getUint32(i+18, true);
    const fnlen = view.getUint16(i+26, true);
    const xlen  = view.getUint16(i+28, true);
    const fname = dec.decode(u8.slice(i+30, i+30+fnlen));
    const dstart = i+30+fnlen+xlen;
    if (!(flags & 8) && TARGETS.has(fname)) {
      const raw = u8.slice(dstart, dstart+csize);
      if (comp === 0) {
        entries[fname] = dec.decode(raw);
      } else {
        const ds = new DecompressionStream('deflate-raw');
        const w = ds.writable.getWriter();
        w.write(raw); w.close();
        const chunks = [], reader = ds.readable.getReader();
        for (;;) { const {done,value} = await reader.read(); if(done) break; chunks.push(value); }
        let tot = 0; for (const c of chunks) tot += c.length;
        const out = new Uint8Array(tot); let pos = 0;
        for (const c of chunks) { out.set(c, pos); pos += c.length; }
        entries[fname] = dec.decode(out);
      }
    }
    i = dstart + csize;
    if (flags & 8) i += 16;
  }
  const shared = [];
  if (entries['xl/sharedStrings.xml']) {
    new DOMParser().parseFromString(entries['xl/sharedStrings.xml'], 'text/xml')
      .querySelectorAll('si').forEach(si =>
        shared.push([...si.querySelectorAll('t')].map(t=>t.textContent).join(''))
      );
  }
  if (!entries['xl/worksheets/sheet1.xml']) return [];
  const doc = new DOMParser().parseFromString(entries['xl/worksheets/sheet1.xml'], 'text/xml');
  const colIdx = ref => { const m = ref.match(/^([A-Z]+)/); if(!m) return 0; let n=0; for(const c of m[1]) n=n*26+c.charCodeAt(0)-64; return n-1; };
  const rowMap = {}; let maxR=0, maxC=0;
  for (const re of doc.querySelectorAll('row')) {
    const r = +re.getAttribute('r'); maxR = Math.max(maxR,r);
    for (const ce of re.querySelectorAll('c')) {
      const ref = ce.getAttribute('r'); const col = colIdx(ref); maxC = Math.max(maxC,col);
      const t = ce.getAttribute('t'); const v = ce.querySelector('v');
      let val = null;
      if (v && v.textContent !== '') {
        if (t==='s') val = shared[+v.textContent]; else { const n=+v.textContent; val=isNaN(n)?v.textContent:n; }
      }
      if (!rowMap[r]) rowMap[r] = {};
      rowMap[r][col] = val;
    }
  }
  return Array.from({length:maxR}, (_,ri) =>
    Array.from({length:maxC+1}, (_,ci) => rowMap[ri+1]?.[ci]??null)
  );
}

      const i = arr.indexOf(l);
      // feesをmaxYearsに揃える（短い場合はnullで埋める）
      const fees = Array.from({length:maxYears}, (_,y) => (l.fees||[])[y] ?? null);
      return `<tr>
        <td class="center" style="position:sticky; left:0; background:#fff; z-index:1"><input type="checkbox" class="row-cb" data-i="${i}"></td>
        <td style="position:sticky; left:30px; background:#fff; z-index:1"><input class="right" type="number" style="width:60px" data-i="${i}" data-f="id" value="${l.id||''}"></td>
        <td class="left" style="position:sticky; left:74px; background:#fff; z-index:1"><input style="width:200px" data-i="${i}" data-f="name" value="${(l.name||'').split('\n').join(' ')}"></td>
        ${fees.map((v, y) => `<td style="min-width:60px"><input class="right" type="number" data-i="${i}" data-y="${y}" value="${v==null?'':v}"></td>`).join('')}
      </tr>`;
    }).join('');
    const colSpan = maxYears + 3;
    if(filtered.length > 500){
      body.innerHTML += `<tr><td colspan="${colSpan}" class="center muted">... 表示は最大500件（全${filtered.length}件）</td></tr>`;
    }
    if(filtered.length === 0){
      body.innerHTML = `<tr><td colspan="${colSpan}" class="center muted">条件に一致する行がありません</td></tr>`;
    }
    body.querySelectorAll('input[data-y]').forEach(inp => {
      inp.onchange = () => {
        const i = Number(inp.dataset.i), y = Number(inp.dataset.y);
        if(!arr[i].fees) arr[i].fees = [];
        while(arr[i].fees.length <= y) arr[i].fees.push(null);
        arr[i].fees[y] = inp.value==='' ? null : Number(inp.value);
        persist();
      };
    });
    body.querySelectorAll('input[data-f]').forEach(inp => {
      inp.onchange = () => {
        const i = Number(inp.dataset.i), f = inp.dataset.f;
        arr[i][f] = f === 'id' ? Number(inp.value) : inp.value;
        persist();
      };
    });
    wireCheckboxes('gl', arr);
  }
  renderRows();
  document.getElementById('gl-search').oninput = renderRows;
  document.getElementById('gl-only-data').onchange = renderRows;
  document.getElementById('gl-import-btn').onclick = () => document.getElementById('gl-import-file').click();
  document.getElementById('gl-import-file').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    try {
      const rows = await parseXlsxToArray(file);
      if(rows.length < 2) return alert('データが見つかりませんでした');
      // 列数をExcelから自動検出（35年・40年・50年すべて対応）
      const maxCols = Math.max(...rows.map(r => r.length));
      const yearCols = Math.max(0, maxCols - 2);
      const imported = rows.slice(1).filter(r => r[1] != null).map(r => ({
        id: Number(r[0])||0,
        name: String(r[1]||''),
        fees: Array.from({length: yearCols}, (_,y) => r[y+2]!=null ? Number(r[y+2]) : null)
      }));
      if (!imported.length) return alert('データが見つかりませんでした');
      if (!confirm(`保証料リストを${imported.length}件（${yearCols}年対応）に更新します。よろしいですか？`)) return;
      STATE.master.guarantee_fees.splice(0, STATE.master.guarantee_fees.length, ...imported);
      persist(); render(); toast(`保証料リストを${imported.length}件（${yearCols}年）読み込みました`);
    } catch(err) { alert('読み込み失敗: ' + err.message); }
    e.target.value = '';
  };
    document.getElementById('gl-add-btn').onclick = () => {
    const nextId = Math.max(0, ...arr.map(g => Number(g.id)||0)) + 1;
    arr.push({id: nextId, name: '', fees: Array.from({length: maxYears}, () => null)});
    document.getElementById('gl-only-data').checked = false;
    persist(); render();
  };
}

/* ---------- ヘッダー・フッターのボタン ---------- */
function setupHeaderButtons(){
  document.getElementById('btn-export').onclick = () => {
    const data = JSON.stringify({master: STATE.master, input: STATE.input}, null, 2);
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `資金計画_${(new Date()).toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('JSONで保存しました');
  };
  document.getElementById('btn-import').onclick = () => {
    document.getElementById('import-file').click();
  };
  document.getElementById('import-file').onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const obj = JSON.parse(ev.target.result);
        if(obj.master) STATE.master = obj.master;
        if(obj.input) STATE.input = obj.input;
        persist(); render();
        toast('JSONを読み込みました');
      } catch(err){
        alert('ファイルの読込に失敗しました: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };
  // 設定のみ保存（マスターデータのみ）
  document.getElementById('btn-export-master').onclick = () => {
    const data = JSON.stringify({master: STATE.master}, null, 2);
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `設定データ_${(new Date()).toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast('設定データを保存しました');
  };
  // 設定のみ読込（マスターデータのみ、顧客inputは維持）
  document.getElementById('btn-import-master').onclick = () => {
    document.getElementById('import-master-file').click();
  };
  document.getElementById('import-master-file').onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const obj = JSON.parse(ev.target.result);
        if(obj.master){
          STATE.master = obj.master;
          persist(); render();
          toast('設定データを読み込みました（顧客データは維持されました）');
        } else if(obj.input === undefined) {
          // masterキーがないがinputもない → 古い形式の可能性、masterとして扱う
          STATE.master = obj;
          persist(); render();
          toast('設定データを読み込みました');
        } else {
          alert('設定データ（master）が見つかりませんでした。\n通常の「JSON読込」をお使いください。');
        }
      } catch(err){
        alert('ファイルの読込に失敗しました: ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };
  document.getElementById('btn-reset').onclick = () => {
    if(!confirm('全てのデータを初期状態に戻します。よろしいですか？')) return;
    localStorage.removeItem(STORAGE_KEY);
    initState();
    render();
    toast('初期化しました');
  };
}

/* ---------- 起動 ---------- */
(function(){
  if(new Date() > new Date('2026-12-31T23:59:59')){
    document.body.innerHTML = '';
    return;
  }
  initState();
  setupHeaderButtons();
  render();
})();

</script>
